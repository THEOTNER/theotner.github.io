<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <style>
      @keyframes pulse { 0%, 100% { r: 2; opacity: 0.8; } 50% { r: 3; opacity: 1; } }
      .core { fill: #2aff99; filter: drop-shadow(0 0 4px #2aff99); }
      .ring { fill: none; stroke: #00ffdd; stroke-width: 0.8; opacity: 0.6; }
      .dot { fill: #00ffdd; animation: pulse 2s infinite; }
    </style>
  </defs>
  <rect width="32" height="32" fill="#080c11"/>
  <circle cx="16" cy="16" r="12" class="ring"/>
  <circle cx="16" cy="16" r="8" class="ring"/>
  <circle cx="16" cy="16" r="4" class="ring"/>
  <circle cx="16" cy="16" r="2.5" class="core dot"/>
  <circle cx="16" cy="8" r="1.2" class="dot" style="animation-delay: 0s"/>
  <circle cx="23" cy="16" r="1.2" class="dot" style="animation-delay: 0.5s"/>
  <circle cx="16" cy="24" r="1.2" class="dot" style="animation-delay: 1s"/>
  <circle cx="9" cy="16" r="1.2" class="dot" style="animation-delay: 1.5s"/>
</svg>
